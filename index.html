<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Online Calculator</h1>
    </header>
    <main>
        <div class="container">
            <div class="display"></div>
            <div class="first_row">
                <button class="numbers_btn">7</button>
                <button class="numbers_btn">8</button>
                <button class="numbers_btn">9</button>
                <button class="operator_btn">+</button>
                <button class="btn" id="backspace_btn">Backspace</button>
            </div>
            <div class="second_row">
                <button class="numbers_btn">4</button>
                <button class="numbers_btn">5</button>
                <button class="numbers_btn">6</button>
                <button class="operator_btn">-</button>
                <button class="btn" id="clr_btn">clr</button>
                
            </div>
            <div class="third_row">
                <button class="numbers_btn">1</button>
                <button class="numbers_btn">2</button>
                <button class="numbers_btn">3</button>
                <button class="operator_btn">×</button>
                
            </div>
            <div class="fourth_row">
                <button class="operator_btn">=</button>
                <button class="numbers_btn">0</button>
                <button class="btn" id="dot_btn">.</button>
                <button class="operator_btn">÷</button>
            </div>
        </div>
    </main>
</body>
</html>
