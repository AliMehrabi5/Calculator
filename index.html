<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Online Calculator</h1>
    </header>
    <main>
        <div class="container">
            <div class="display"></div>
            <div class="first_row">
                <button class="numbers_btn" id="seven">7</button>
                <button class="numbers_btn" id="eight">8</button>
                <button class="numbers_btn" id="nine">9</button>
                <button class="operator_btn" id="plus">+</button>
                <button class="btn" id="backspace_btn">Backspace</button>
            </div>
            <div class="second_row">
                <button class="numbers_btn" id="four">4</button>
                <button class="numbers_btn" id="five">5</button>
                <button class="numbers_btn" id="six">6</button>
                <button class="operator_btn" id="mines">-</button>
                <button class="btn" id="clr_btn">clr</button>
                
            </div>
            <div class="third_row">
                <button class="numbers_btn" id="one">1</button>
                <button class="numbers_btn" id="two">2</button>
                <button class="numbers_btn" id="three">3</button>
                <button class="operator_btn" id="multiply">×</button>
                
            </div>
            <div class="fourth_row">
                <button class="operator_btn" id="equal">=</button>
                <button class="numbers_btn" id="zero">0</button>
                <button class="btn" id="dot_btn">.</button>
                <button class="operator_btn" id="divide">÷</button>
            </div>
        </div>
    </main>
</body>
</html>
